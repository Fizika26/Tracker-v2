<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер ЕГЭ — Математика профиль</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg2: #f7f6f3;
    --bg3: #efede8;
    --border: rgba(55,53,47,0.15);
    --border2: rgba(55,53,47,0.3);
    --text: #1a1a1a;
    --text2: #6b6b6b;
    --text3: #999;
    --purple: #7F77DD;
    --purple-light: #EEEDFE;
    --radius: 8px;
    --radius-lg: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1f1f;
      --bg2: #2a2a2a;
      --bg3: #333;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.2);
      --text: #e8e8e8;
      --text2: #aaa;
      --text3: #666;
      --purple-light: #2e2a5e;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 20px 40px;
  }

  .card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    max-width: 700px;
    margin: 0 auto;
  }

  .section-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 10px;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 2px;
    margin-bottom: 20px;
    border-bottom: 0.5px solid var(--border);
    padding-bottom: 0;
  }
  .tab {
    padding: 7px 14px;
    border: none;
    background: transparent;
    color: var(--text3);
    font-size: 13px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-family: inherit;
    transition: color 0.15s;
  }
  .tab.active {
    color: var(--purple);
    border-bottom-color: var(--purple);
    font-weight: 500;
  }
  .tab:hover:not(.active) { color: var(--text2); }

  .section { display: none; }
  .section.active { display: block; }

  /* LAYOUT */
  .layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }

  /* Термометр */
  .thermo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }
  .thermo-label { font-size: 11px; color: var(--text3); }
  .thermo-tube {
    position: relative;
    width: 32px;
    height: 220px;
    background: var(--bg2);
    border-radius: 99px;
    overflow: hidden;
    border: 0.5px solid var(--border2);
  }
  .thermo-fill {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    border-radius: 99px;
    transition: height 0.4s ease, background 0.4s ease;
    height: 0%;
    background: var(--purple);
  }

  /* Правая часть */
  .right { flex: 1; min-width: 0; }

  .score-row { margin-bottom: 16px; }
  .score-big {
    font-size: 42px;
    font-weight: 500;
    color: var(--text);
    line-height: 1;
    transition: color 0.3s;
  }
  .score-sub { font-size: 15px; color: var(--text2); margin-left: 8px; }
  .score-detail { font-size: 13px; color: var(--text2); margin-top: 5px; }

  /* Прогресс бар */
  .prog-wrap { margin-bottom: 18px; }
  .prog-track {
    height: 8px;
    background: var(--bg2);
    border-radius: 99px;
    overflow: hidden;
  }
  .prog-bar {
    height: 100%;
    border-radius: 99px;
    width: 0%;
    transition: width 0.4s ease, background 0.4s ease;
    background: var(--purple);
  }
  .prog-ends {
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
    font-size: 11px;
    color: var(--text3);
  }

  /* Задания часть 1 */
  .p1-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 5px;
    margin-bottom: 16px;
  }

  .task-btn {
    border-radius: var(--radius);
    padding: 8px 4px;
    text-align: center;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all 0.15s;
    background: var(--bg2);
    user-select: none;
  }
  .task-btn:hover { opacity: 0.8; }
  .task-btn .tn { font-size: 12px; font-weight: 500; color: var(--text3); }
  .task-btn .tm { font-size: 10px; color: var(--text3); margin-top: 2px; }

  /* Задания часть 2 */
  .p2-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .p2-num { font-size: 12px; font-weight: 500; color: var(--text2); width: 36px; flex-shrink: 0; }
  .p2-topic { font-size: 11px; color: var(--text3); width: 90px; flex-shrink: 0; }
  .p2-dots { display: flex; gap: 5px; }
  .dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px solid rgba(127,119,221,0.3);
    background: transparent;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500;
    color: rgba(127,119,221,0.5);
    user-select: none; flex-shrink: 0;
  }
  .dot:hover { opacity: 0.75; }
  .p2-max { font-size: 11px; color: var(--text3); }

  /* Кнопки */
  .btn-row { display: flex; gap: 8px; margin-top: 16px; align-items: center; flex-wrap: wrap; }

  .reset-btn {
    font-size: 12px;
    padding: 5px 14px;
    border-radius: 99px;
    border: 0.5px solid var(--border2);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.12s;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .reset-btn:hover { background: var(--bg2); }

  .save-btn {
    font-size: 12px;
    padding: 5px 16px;
    border-radius: 99px;
    border: none;
    background: var(--purple);
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.12s;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .save-btn:hover { opacity: 0.85; }
  .save-btn:disabled { opacity: 0.4; cursor: default; }

  .date-field {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text2);
  }
  .date-field input {
    border: 0.5px solid var(--border2);
    border-radius: 6px;
    background: var(--bg2);
    color: var(--text);
    font-size: 12px;
    padding: 4px 8px;
    outline: none;
    font-family: inherit;
  }
  .date-field input:focus { border-color: var(--purple); }

  .note-field { margin-top: 10px; }
  .note-field textarea {
    width: 100%;
    border: 0.5px solid var(--border2);
    border-radius: 8px;
    background: var(--bg2);
    color: var(--text);
    font-size: 12px;
    padding: 8px 10px;
    outline: none;
    font-family: inherit;
    resize: none;
    line-height: 1.5;
    min-height: 56px;
  }
  .note-field textarea:focus { border-color: var(--purple); }
  .note-field textarea::placeholder { color: var(--text3); }
  .hist-note {
    font-size: 12px; color: var(--text2);
    margin-top: 6px; padding-top: 6px;
    border-top: 0.5px solid var(--border);
    line-height: 1.5; white-space: pre-wrap;
  }
  .modal-note { margin-top: 14px; padding-top: 12px; border-top: 0.5px solid var(--border); font-size: 12px; color: var(--text2); line-height: 1.6; white-space: pre-wrap; }
  .modal-note-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px; }

  /* HISTORY */
  .hist-empty {
    text-align: center;
    padding: 40px;
    color: var(--text3);
    font-size: 14px;
  }

  .hist-entry {
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .hist-entry:hover { background: var(--bg2); }

  .hist-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .hist-date { font-size: 12px; color: var(--text3); }
  .hist-score { font-size: 22px; font-weight: 500; }
  .hist-raw { font-size: 12px; color: var(--text2); margin-left: 6px; }
  .hist-trend { font-size: 12px; font-weight: 500; }
  .trend-up { color: #0F6E56; }
  .trend-dn { color: #A32D2D; }
  .trend-eq { color: var(--text3); }

  .hist-bars {
    display: grid;
    grid-template-columns: repeat(19, 1fr);
    gap: 3px;
    height: 28px;
    align-items: flex-end;
  }
  .hb {
    border-radius: 2px 2px 0 0;
    min-height: 3px;
    transition: height 0.3s;
  }

  .del-btn {
    background: none;
    border: 0.5px solid var(--border);
    color: var(--text3);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .del-btn:hover { background: #fff0f0; border-color: #A32D2D; color: #A32D2D; }

  /* DETAIL MODAL */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal {
    background: var(--bg);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-lg);
    padding: 22px;
    max-width: 500px; width: 100%;
    max-height: 85vh; overflow-y: auto;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .modal-close {
    background: none; border: none;
    color: var(--text2); font-size: 18px; cursor: pointer;
  }
  .modal-tasks {
    display: flex; flex-direction: column; gap: 8px;
  }
  .mt-row {
    display: flex; align-items: center; gap: 10px;
  }
  .mt-num { font-size: 12px; color: var(--text2); width: 60px; flex-shrink: 0; }
  .mt-bar-wrap { flex: 1; height: 10px; background: var(--bg2); border-radius: 99px; overflow: hidden; }
  .mt-bar { height: 100%; border-radius: 99px; transition: width 0.4s; }
  .mt-score { font-size: 12px; font-weight: 500; width: 40px; text-align: right; flex-shrink: 0; }

  /* ДИНАМИКА */
  .chart-card {
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 14px;
  }
  .chart-title { font-size: 12px; color: var(--text2); margin-bottom: 12px; font-weight: 500; }
  .chart-wrap { position: relative; width: 100%; height: 200px; }

  /* HEATMAP */
  .hmap-section { margin-bottom: 16px; }
  .hmap-grid {
    display: grid;
    grid-template-columns: repeat(19, 1fr);
    gap: 4px;
    align-items: flex-end;
  }
  .hmap-col { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .hmap-n { font-size: 9px; color: var(--text3); }
  .hmap-bar-bg { width: 100%; height: 60px; background: var(--bg2); border-radius: 3px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
  .hmap-bar-fill { width: 100%; border-radius: 3px 3px 0 0; }
  .hmap-pct { font-size: 9px; color: var(--text3); }

  @media (max-width: 480px) {
    .p1-grid { grid-template-columns: repeat(4, 1fr); }
    .p2-topic { display: none; }
    .score-big { font-size: 32px; }
    .hist-bars { grid-template-columns: repeat(10, 1fr); }
    .hmap-grid { grid-template-columns: repeat(10, 1fr); }
  }
</style>
</head>
<body>

<div class="card">

  <div class="tabs">
    <button class="tab active" onclick="switchTab('calc')">Пробник</button>
    <button class="tab" onclick="switchTab('history')">История</button>
    <button class="tab" onclick="switchTab('dynamics')">Динамика</button>
  </div>

  <!-- КАЛЬКУЛЯТОР -->
  <div id="sec-calc" class="section active">
    <div class="layout">
      <div class="thermo-wrap">
        <span class="thermo-label">100</span>
        <div class="thermo-tube">
          <div class="thermo-fill" id="thermo-fill"></div>
        </div>
        <span class="thermo-label">0</span>
      </div>

      <div class="right">
        <div class="score-row">
          <div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;">
            <span class="score-big" id="score-big">—</span>
            <span class="score-sub">тестовый балл</span>
          </div>
          <div class="score-detail">
            Первичных: <strong id="raw-score">0</strong> / 32
            &nbsp;·&nbsp;
            Оценка: <strong id="grade-out">—</strong>
          </div>
        </div>

        <div class="prog-wrap">
          <div class="prog-track"><div class="prog-bar" id="prog-bar"></div></div>
          <div class="prog-ends"><span>0</span><span>100</span></div>
        </div>

        <div class="section-label">Часть 1 — задания 1–12 (по 1 баллу)</div>
        <div class="p1-grid" id="tasks-p1"></div>

        <div class="section-label">Часть 2 — задания 13–19</div>
        <div id="tasks-p2"></div>

        <div class="note-field">
          <textarea id="f-note" placeholder="Заметки: что получилось, что нет, над чем работать…" rows="2"></textarea>
        </div>
        <div class="btn-row">
          <div class="date-field">
            <input type="date" id="f-date">
          </div>
          <button class="save-btn" onclick="saveEntry()">
            Сохранить
          </button>
          <button class="reset-btn" onclick="resetAll()">
            Сбросить
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ИСТОРИЯ -->
  <div id="sec-history" class="section">
    <div id="hist-list"><div class="hist-empty">Нет сохранённых пробников</div></div>
  </div>

  <!-- ДИНАМИКА -->
  <div id="sec-dynamics" class="section">
    <div class="chart-card">
      <div class="chart-title">Тестовый балл по пробникам</div>
      <div class="chart-wrap"><canvas id="chart-score" role="img" aria-label="Динамика тестового балла">График баллов</canvas></div>
    </div>
    <div class="chart-card hmap-section">
      <div class="chart-title">Средний % выполнения по заданиям</div>
      <div class="hmap-grid" id="hmap-grid"></div>
    </div>
  </div>

</div>

<!-- DETAIL OVERLAY -->
<div class="overlay" id="overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div style="font-size:15px;font-weight:500" id="modal-title"></div>
        <div style="font-size:12px;color:var(--text3);margin-top:2px" id="modal-sub"></div>
      </div>
      <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-tasks" id="modal-tasks"></div>
    <div id="modal-note-content" style="display:none"><div class="modal-note-label">Заметки</div><div class="modal-note"></div></div>
  </div>
</div>

<script>
const TASKS = [
  {n:1,max:1},{n:2,max:1},{n:3,max:1},{n:4,max:1},{n:5,max:1},{n:6,max:1},
  {n:7,max:1},{n:8,max:1},{n:9,max:1},{n:10,max:1},{n:11,max:1},{n:12,max:1},
  {n:13,max:2},{n:14,max:3},{n:15,max:2},{n:16,max:2},{n:17,max:3},{n:18,max:4},{n:19,max:4}
];
const TOPICS = {
  13:'Уравнение',14:'Стереометрия',15:'Неравенство',
  16:'Экономика',17:'Планиметрия',18:'Параметр',19:'Олимпиадная'
};
const SCALE = {
  0:0,1:6,2:11,3:17,4:22,5:27,6:34,7:40,8:46,9:52,10:58,11:64,12:70,
  13:72,14:74,15:76,16:78,17:80,18:82,19:84,20:86,21:88,22:90,23:92,
  24:94,25:95,26:96,27:97,28:98,29:99,30:100,31:100,32:100
};
const PURPLE = '#7F77DD';

const state = {};
TASKS.forEach(t => state[t.n] = 0);

let entries = [];
try { const s = localStorage.getItem('ege-math-v3'); if(s) entries = JSON.parse(s); } catch(e){}

function persist() { try { localStorage.setItem('ege-math-v3', JSON.stringify(entries)); } catch(e){} }

function toTest(r) { return SCALE[Math.min(32,Math.max(0,Math.round(r)))] ?? 0; }

function scoreColor(t) {
  if (t >= 80) return '#0F6E56';
  if (t >= 60) return '#185FA5';
  if (t >= 27) return '#854F0B';
  return '#A32D2D';
}

function toGrade(t) {
  if (t >= 72) return '5';
  if (t >= 50) return '4';
  if (t >= 27) return '3';
  return '2';
}

function barColor(pct) {
  if (pct >= 85) return '#0F6E56';
  if (pct >= 60) return '#185FA5';
  if (pct >= 40) return '#854F0B';
  return '#A32D2D';
}

function update() {
  const raw = TASKS.reduce((s,t) => s + state[t.n], 0);
  const test = toTest(raw);
  const col = test > 0 ? scoreColor(test) : PURPLE;
  document.getElementById('raw-score').textContent = raw;
  const big = document.getElementById('score-big');
  big.textContent = test || '—';
  big.style.color = test > 0 ? col : 'var(--text)';
  const g = document.getElementById('grade-out');
  g.textContent = test > 0 ? toGrade(test) : '—';
  g.style.color = test > 0 ? col : 'var(--text)';
  document.getElementById('thermo-fill').style.height = test + '%';
  document.getElementById('thermo-fill').style.background = col;
  document.getElementById('prog-bar').style.width = test + '%';
  document.getElementById('prog-bar').style.background = col;
}

/* Часть 1 */
const p1 = document.getElementById('tasks-p1');
TASKS.filter(t => t.n <= 12).forEach(t => {
  const d = document.createElement('div');
  d.className = 'task-btn';
  d.id = 'btn' + t.n;
  d.innerHTML = `<div class="tn">${t.n}</div><div class="tm">+1</div>`;
  d.onclick = () => {
    state[t.n] = state[t.n] ? 0 : 1;
    d.style.background = state[t.n] ? PURPLE + '22' : 'var(--bg2)';
    d.style.borderColor = state[t.n] ? PURPLE : 'transparent';
    d.querySelector('.tn').style.color = state[t.n] ? PURPLE : 'var(--text3)';
    update();
  };
  p1.appendChild(d);
});

/* Часть 2 */
const p2 = document.getElementById('tasks-p2');
TASKS.filter(t => t.n >= 13).forEach(t => {
  const row = document.createElement('div');
  row.className = 'p2-row';
  const num = document.createElement('span');
  num.className = 'p2-num';
  num.textContent = '№' + t.n;
  const topic = document.createElement('span');
  topic.className = 'p2-topic';
  topic.textContent = TOPICS[t.n];
  const dots = document.createElement('div');
  dots.className = 'p2-dots';
  for (let i = 1; i <= t.max; i++) {
    const c = document.createElement('div');
    c.className = 'dot';
    c.textContent = i;
    c.dataset.n = t.n;
    c.dataset.i = i;
    c.onclick = () => {
      state[t.n] = state[t.n] === i ? i - 1 : i;
      refreshDots(t.n, t.max, dots);
      update();
    };
    dots.appendChild(c);
  }
  const maxlbl = document.createElement('span');
  maxlbl.className = 'p2-max';
  maxlbl.textContent = 'макс. ' + t.max;
  row.appendChild(num);
  row.appendChild(topic);
  row.appendChild(dots);
  row.appendChild(maxlbl);
  p2.appendChild(row);
});

function refreshDots(n, max, dotsEl) {
  const v = state[n];
  for (let j = 1; j <= max; j++) {
    const sib = dotsEl.querySelector('[data-i="'+j+'"]');
    sib.style.background = j <= v ? PURPLE : 'transparent';
    sib.style.color = j <= v ? 'white' : 'rgba(127,119,221,0.5)';
    sib.style.borderColor = j <= v ? PURPLE : 'rgba(127,119,221,0.3)';
  }
}

function resetAll() {
  TASKS.forEach(t => state[t.n] = 0);
  TASKS.filter(t => t.n <= 12).forEach(t => {
    const d = document.getElementById('btn' + t.n);
    d.style.background = 'var(--bg2)';
    d.style.borderColor = 'transparent';
    d.querySelector('.tn').style.color = 'var(--text3)';
  });
  TASKS.filter(t => t.n >= 13).forEach(t => {
    const dots = p2.querySelectorAll('[data-n="'+t.n+'"]');
    const dotsEl = dots[0]?.parentElement;
    if (dotsEl) refreshDots(t.n, t.max, dotsEl);
  });
  update();
}

function saveEntry() {
  const dateVal = document.getElementById('f-date').value;
  if (!dateVal) { alert('Выбери дату'); return; }
  const raw = TASKS.reduce((s,t) => s + state[t.n], 0);
  const test = toTest(raw);
  const scores = {};
  TASKS.forEach(t => scores[t.n] = state[t.n]);
  const part1 = TASKS.filter(t=>t.n<=12).reduce((s,t)=>s+state[t.n],0);
  const part2 = TASKS.filter(t=>t.n>=13).reduce((s,t)=>s+state[t.n],0);
  const note = document.getElementById('f-note').value.trim();
  entries.push({ id: Date.now(), date: dateVal, raw, test, part1, part2, scores, note });
  entries.sort((a,b) => a.date.localeCompare(b.date));
  persist();
  renderHistory();
  renderDynamics();
  resetAll();
  document.getElementById('f-note').value = '';
  switchTab('history');
}

function deleteEntry(id, e) {
  e.stopPropagation();
  entries = entries.filter(x => x.id !== id);
  persist();
  renderHistory();
  renderDynamics();
}

function fmtDate(d) {
  return new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'});
}

function renderHistory() {
  const el = document.getElementById('hist-list');
  if (!entries.length) {
    el.innerHTML = '<div class="hist-empty">Нет сохранённых пробников.<br>Заполни пробник и нажми «Сохранить».</div>';
    return;
  }
  el.innerHTML = [...entries].reverse().map((e, idx, arr) => {
    const prev = arr[idx+1];
    let trendHtml = '';
    if (prev) {
      const d = e.test - prev.test;
      const cls = d > 0 ? 'trend-up' : d < 0 ? 'trend-dn' : 'trend-eq';
      const sign = d > 0 ? '+' : '';
      trendHtml = `<span class="hist-trend ${cls}">${sign}${d}</span>`;
    }
    const col = scoreColor(e.test);
    // mini bars for all tasks
    const barsHtml = TASKS.map(t => {
      const v = e.scores[t.n]||0;
      const pct = Math.round(v/t.max*100);
      const bc = barColor(pct);
      const h = Math.max(3, Math.round(pct * 0.25));
      return `<div class="hb" style="height:${h}px;background:${bc}${pct===0?'33':''}"></div>`;
    }).join('');
    return `<div class="hist-entry" onclick="openModal(${e.id})">
      <div class="hist-top">
        <span class="hist-date">${fmtDate(e.date)}</span>
        <div style="display:flex;align-items:baseline;gap:6px;margin-left:auto">
          ${trendHtml}
          <span class="hist-score" style="color:${col}">${e.test}</span>
          <span class="hist-raw">первичных ${e.raw}/32</span>
        </div>
        <button class="del-btn" onclick="deleteEntry(${e.id},event)" title="Удалить">×</button>
      </div>
      <div class="hist-bars">${barsHtml}</div>
      ${e.note ? `<div class="hist-note"><i class="ti ti-notes" style="font-size:11px;margin-right:4px;vertical-align:-1px;color:var(--text3)"></i>${e.note}</div>` : ''}
    </div>`;
  }).join('');
}

function openModal(id) {
  const e = entries.find(x=>x.id===id);
  if (!e) return;
  document.getElementById('modal-title').textContent = fmtDate(e.date);
  document.getElementById('modal-sub').textContent =
    `Тестовый балл: ${e.test} · Первичных: ${e.raw}/32 · Ч.1: ${e.part1}/12 · Ч.2: ${e.part2}/20`;
  const mt = document.getElementById('modal-tasks');
  mt.innerHTML = TASKS.map(t => {
    const v = e.scores[t.n]||0;
    const pct = Math.round(v/t.max*100);
    const col = barColor(pct);
    const label = t.n <= 12 ? `Задание ${t.n}` : `Задание ${t.n} — ${TOPICS[t.n]}`;
    return `<div class="mt-row">
      <span class="mt-num">${label}</span>
      <div class="mt-bar-wrap"><div class="mt-bar" style="width:${pct}%;background:${col}"></div></div>
      <span class="mt-score" style="color:${col}">${v}/${t.max}</span>
    </div>`;
  }).join('');
  const noteEl = document.getElementById('modal-note-content');
  if (e.note) { noteEl.style.display='block'; noteEl.querySelector('.modal-note').textContent = e.note; } else { noteEl.style.display='none'; }
  document.getElementById('overlay').style.display = 'flex';
}
function closeModal() { document.getElementById('overlay').style.display = 'none'; }

let charts = {};
function renderDynamics() {
  if (!entries.length) return;
  const labels = entries.map(e => fmtDate(e.date));

  if (charts.score) charts.score.destroy();
  charts.score = new Chart(document.getElementById('chart-score'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Тестовый балл',
        data: entries.map(e=>e.test),
        borderColor: PURPLE,
        backgroundColor: PURPLE+'18',
        fill: true, tension: 0.35,
        pointRadius: 5, pointBackgroundColor: PURPLE, borderWidth: 2
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks:{font:{size:10}}, grid:{color:'rgba(0,0,0,0.05)'} },
        y: { min:0, max:100, ticks:{font:{size:10}}, grid:{color:'rgba(0,0,0,0.05)'} }
      }
    }
  });

  // Heatmap
  const hg = document.getElementById('hmap-grid');
  const avgs = TASKS.map(t => {
    const avg = entries.reduce((a,e)=>a+(e.scores[t.n]||0),0)/entries.length;
    const pct = Math.round(avg/t.max*100);
    return { ...t, pct };
  });
  hg.innerHTML = avgs.map(t => {
    const c = barColor(t.pct);
    return `<div class="hmap-col">
      <div class="hmap-n">${t.n}</div>
      <div class="hmap-bar-bg">
        <div class="hmap-bar-fill" style="height:${t.pct}%;background:${c}"></div>
      </div>
      <div class="hmap-pct" style="color:${c}">${t.pct}%</div>
    </div>`;
  }).join('');
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) =>
    t.classList.toggle('active', ['calc','history','dynamics'][i]===tab));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-'+tab).classList.add('active');
  if (tab==='dynamics') renderDynamics();
}

// Init
document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
renderHistory();
update();
</script>
</body>
</html>
